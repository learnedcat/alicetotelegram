version: "3.9"

services:
  alice-gpt:
    build: .
    container_name: alice-telegram
    restart: unless-stopped

    ports:
      - "127.0.0.1:3003:8080"

    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"

    logging:
      options:
        max-size: "10m"
        max-file: "3"
